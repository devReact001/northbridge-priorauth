services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: priorauth
      POSTGRES_PASSWORD: priorauth
      POSTGRES_DB: priorauth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priorauth"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://priorauth:priorauth@db:5432/priorauth
      OUTBOX_DIR: /data/outbox
    ports:
      - "8000:8000"
    volumes:
      - ./outbox:/data/outbox
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
